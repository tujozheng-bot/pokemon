<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Pokémon Exhibition Booth</title>
    <style>
        :root {
            /* Official-style Palette */
            --poke-yellow: #FFCB05;
            --poke-blue: #2A75BB;
            --poke-red: #EE1515;
            --poke-dark: #222224;
            --poke-light: #F6F6F6;
            --poke-green: #4DAD5B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #2a2a2a 0%, #000000 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* 3D Scene Setup */
        #scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            transform-style: preserve-3d;
        }

        #scene:active {
            cursor: grabbing;
        }

        #world {
            position: relative;
            transform-style: preserve-3d;
            /* Initial Camera Angle */
            transform: translateZ(-900px) rotateX(-15deg) rotateY(-35deg);
            transition: transform 0.1s linear;
        }

        #floor {
            position: absolute;
            top: 50%; left: 50%;
            width: 8000px; height: 8000px;
            margin-left: -4000px; margin-top: -4000px;
            background: radial-gradient(circle at center, rgba(30,30,30,1) 0%, rgba(5,5,5,1) 30%);
            transform: rotateX(90deg) translateZ(0);
            transform-style: preserve-3d;
        }

        /* Exhibition Blue Carpet */
        #carpet {
            position: absolute;
            top: 50%; left: 50%;
            width: 1800px; height: 1200px;
            margin-left: -900px; margin-top: -600px;
            background: var(--poke-blue);
            box-shadow: 0 0 150px rgba(42, 117, 187, 0.4);
            transform: translateZ(2px);
            border: 4px solid rgba(255,255,255,0.1);
        }

        /* 3D Core Components */
        .box, .sprite {
            position: absolute;
            top: 50%; left: 50%;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            top: 0; left: 0;
            border: 1px solid rgba(0, 0, 0, 0.15);
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fake 3D Shading */
        .face.f { filter: brightness(1); }
        .face.l { filter: brightness(0.85); }
        .face.r { filter: brightness(0.75); }
        .face.b { filter: brightness(0.6); }
        .face.t { filter: brightness(1.2); }
        .face.bot { filter: brightness(0.4); }

        /* ========================================================= */
        /* Custom Textures & Gradients */
        /* ========================================================= */

        /* 1. Sticker Bomb Texture */
        .sticker-bomb .face {
            background-color: #fff !important;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(238,21,21,0.7) 15px, rgba(238,21,21,0.7) 30px),
                repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(42,117,187,0.7) 20px, rgba(42,117,187,0.7) 40px),
                repeating-linear-gradient(0deg, transparent, transparent 25px, rgba(255,203,5,0.8) 25px, rgba(255,203,5,0.8) 50px) !important;
            background-blend-mode: multiply;
        }

        /* 2. Checkered Pillar */
        .checkered .face {
            background: conic-gradient(var(--poke-light) 90deg, var(--poke-blue) 90deg 180deg, var(--poke-light) 180deg 270deg, var(--poke-blue) 270deg) 0 0 / 60px 60px !important;
        }

        /* 3. Japanese Glowing Screens */
        .jp-screen .face {
            background: rgba(255, 255, 255, 0.9) !important;
            background-image: 
                linear-gradient(90deg, rgba(238,21,21,0.2) 2px, transparent 2px),
                linear-gradient(180deg, rgba(238,21,21,0.2) 2px, transparent 2px) !important;
            background-size: 20px 20px !important;
            box-shadow: inset 0 0 30px rgba(238, 21, 21, 0.6);
            border: 2px solid var(--poke-red);
        }

        /* 4. Switch Demo Kiosks */
        .switch-screen {
            background: #111 !important;
            border-left: 14px solid #00C3E3 !important; /* Joycon Blue */
            border-right: 14px solid #FF4554 !important; /* Joycon Red */
            border-top: 4px solid #333 !important;
            border-bottom: 4px solid #333 !important;
        }

        /* 5. Pikachu Floating Details */
        .pika-ear-tip .face {
            background: linear-gradient(to bottom, #222 30%, var(--poke-yellow) 30%) !important;
        }

        /* 6. Desk Labels */
        .desk-label {
            background: var(--poke-yellow);
            color: #000;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: 900;
            border: 4px solid #000;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Floor Shadows */
        .shadow-blob {
            position: absolute;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            filter: blur(25px);
            transform: rotateX(90deg);
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        #instructions {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            text-align: center; font-size: 16px; color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 4px #000; font-weight: bold;
        }
        #controls {
            position: absolute; bottom: 40px; right: 40px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 15px;
        }
        .btn-zoom {
            background: rgba(42, 117, 187, 0.9); color: #fff;
            border: 2px solid #fff; border-radius: 50%;
            width: 50px; height: 50px; font-size: 28px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-zoom:hover { transform: scale(1.1); background: var(--poke-red); }
        .btn-zoom:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="scene">
        <div id="world">

                <!-- Floor Shadows for large elements -->
                <div class="shadow-blob" style="width: 400px; height: 200px; top: 50%; left: 50%; margin-left:-200px; margin-top:-300px; transform: translateZ(5px);"></div> <!-- Center Base -->

            <!-- ========================================================= -->

            <div class="box" data-w="20" data-h="320" data-d="20" data-x="910" data-y="-180" data-z="-200" data-c="var(--poke-red)"></div>
            <div class="box" data-w="20" data-h="320" data-d="20" data-x="750" data-y="-180" data-z="-200" data-c="var(--poke-red)"></div>
            
            <!-- Glowing Shoji Screens -->

            <!-- ========================================================= -->
            <!-- 1. FRONT-LEFT: MEDIA CHECK-IN & PIKACHU ARCHWAY           -->
            <!-- ========================================================= -->
            <!-- Sticker Bomb Desk 1 -->
            <div class="box sticker-bomb" data-w="200" data-h="110" data-d="80" data-x="-400" data-y="-55" data-z="350" data-c="var(--poke-light)"></div>

            <!-- Giant Pikachu Ear Archway (Sprite) -->
            <div class="sprite" data-w="500" data-h="400" data-x="-290" data-y="-310" data-z="350">

            <div class="box" data-cls="tcg" data-w="22" data-h="35" data-d="4" data-x="400" data-y="-122" data-z="270" data-rx="-15" data-c="#FFD700"></div>

    <!-- UI Layer -->

            <button class="btn-zoom" id="z-in" title="Zoom In">+</button>
            <button class="btn-zoom" id="z-out" title="Zoom Out">-</button>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buildGeometry = () => {
                const elements = document.querySelectorAll('.box, .sprite');

                elements.forEach(el => {
                    const w = parseFloat(el.getAttribute('data-w'));
                    const h = parseFloat(el.getAttribute('data-h'));
                    const d = parseFloat(el.getAttribute('data-d')) || 0;
                    const x = parseFloat(el.getAttribute('data-x'));
                    const y = parseFloat(el.getAttribute('data-y'));
                    const z = parseFloat(el.getAttribute('data-z'));
                    const c = el.getAttribute('data-c');
                    const rx = parseFloat(el.getAttribute('data-rx') || 0);
                    const ry = parseFloat(el.getAttribute('data-ry') || 0);
                    const rz = parseFloat(el.getAttribute('data-rz') || 0);
                    const cls = el.getAttribute('data-cls');

                    // Set container bounds and position
                    el.style.width = `${w}px`;
                    el.style.height = `${h}px`;
                    el.style.transform = `translate3d(${x - w/2}px, ${y - h/2}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;

                    // Skip face generation for 2D sprites
                    if (el.classList.contains('sprite')) return;

                    // Generate 6 3D faces
                    const faces = ['f', 'b', 'l', 'r', 't', 'bot'];
                    faces.forEach(face => {
                        const f = document.createElement('div');
                        f.className = `face ${face}`;
                        f.style.backgroundColor = c;

                        if (face === 'f') {
                            f.style.width = '100%'; f.style.height = '100%';
                            f.style.transform = `translateZ(${d/2}px)`;
                            
                            // Specific Face Graphics
                            if (cls === 'pika-head') {
                                f.innerHTML = `
                                    <!-- Eyes -->
                                    <div style="position:absolute; top:35%; left:20%; width:24px; height:24px; background:#111; border-radius:50%; box-shadow:96px 0 0 #111;">
                                        <div style="position:absolute; top:4px; left:4px; width:8px; height:8px; background:#fff; border-radius:50%; box-shadow:96px 0 0 #fff;"></div>
                                    </div>
                                    <!-- Cheeks -->
                                    <div style="position:absolute; top:55%; left:5%; width:36px; height:36px; background:var(--poke-red); border-radius:50%; box-shadow:118px 0 0 var(--poke-red);"></div>
                                    <!-- Mouth -->
                                    <svg style="position:absolute; top:48%; left:50%; margin-left:-15px; width:30px; height:20px;" viewBox="0 0 30 20">
                                        <path d="M 0 0 Q 7 15 15 0 Q 23 15 30 0 L 25 15 Q 15 25 5 15 Z" fill="var(--poke-red)" />
                                    </svg>`;
                            }
                            if (cls === 'switch') {
                                f.classList.add('switch-screen');
                                f.innerHTML = `<span style="font-size:20px; font-weight:900; color:#fff; font-style:italic;">NINTENDO</span>`;
                            }
                            if (cls === 'plush') {
                                f.innerHTML = `<div style="position:absolute; top:40%; left:25%; width:4px; height:4px; background:#111; border-radius:50%; box-shadow:10px 0 0 #111;"></div><div style="position:absolute; top:60%; left:50%; width:6px; height:3px; background:#111; margin-left:-3px; border-radius:0 0 50px 50px;"></div>`;
                            }
                            if (cls === 'tcg') {
                                f.innerHTML = `<div style="width:100%; height:100%; border:2px solid var(--poke-blue); display:flex; justify-content:center; align-items:center; font-size:8px; color:var(--poke-blue); font-weight:bold; background:radial-gradient(circle, #fff, #FFD700);">TCG</div>`;
                            }
                            if (cls === 'game') {
                                f.innerHTML = `<div style="width:100%; height:100%; background:linear-gradient(135deg, rgba(255,255,255,0.4), transparent); border:1px solid #111; display:flex; flex-direction:column; align-items:center;"><div style="background:#fff; width:100%; height:8px; font-size:5px; color:var(--poke-red); text-align:center; line-height:8px; font-weight:900;">SWITCH</div></div>`;
                            }
                        }
                        if (face === 'b') {
                            f.style.width = '100%'; f.style.height = '100%';
                            f.style.transform = `rotateY(180deg) translateZ(${d/2}px)`;
                        }
                        if (face === 'l') { 
                            f.style.width = `${d}px`; f.style.height = '100%'; 
                            f.style.left = '50%'; f.style.marginLeft = `${-d/2}px`;
                            f.style.transform = `rotateY(-90deg) translateZ(${w/2}px)`; 
                        }
                        if (face === 'r') { 
                            f.style.width = `${d}px`; f.style.height = '100%'; 
                            f.style.left = '50%'; f.style.marginLeft = `${-d/2}px`;
                            f.style.transform = `rotateY(90deg) translateZ(${w/2}px)`; 
                        }
                        if (face === 't') { 
                            f.style.width = '100%'; f.style.height = `${d}px`; 
                            f.style.top = '50%'; f.style.marginTop = `${-d/2}px`;
                            f.style.transform = `rotateX(90deg) translateZ(${h/2}px)`; 
                        }
                        if (face === 'bot') { 
                            f.style.width = '100%'; f.style.height = `${d}px`; 
                            f.style.top = '50%'; f.style.marginTop = `${-d/2}px`;
                            f.style.transform = `rotateX(-90deg) translateZ(${h/2}px)`; 
                        }

                        el.appendChild(f);
                    });
                });
            };

            buildGeometry();

            const world = document.getElementById('world');
            let rotX = -15, rotY = -35, zoomZ = -1000;
            let isDragging = false, startX, startY;
            let autoRotate = true;

            const updateTransform = () => {
                world.style.transform = `translateZ(${zoomZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            };

            const changeZoom = (amount) => {
                zoomZ += amount;
                zoomZ = Math.max(-2500, Math.min(800, zoomZ));
                updateTransform();
            };

            // Auto-rotate animation loop
            const tick = () => {
                if (autoRotate) {
                    rotY += 0.15;
                    updateTransform();
                }
                requestAnimationFrame(tick);
            };
            tick();

            // Wheel Scroll to Zoom
            document.addEventListener('wheel', (e) => {
                autoRotate = false;
                changeZoom(e.deltaY < 0 ? 150 : -150);
            }, {passive: true});

            // UI Buttons to Zoom
            document.getElementById('z-in').addEventListener('click', () => { autoRotate = false; changeZoom(300); });
            document.getElementById('z-out').addEventListener('click', () => { autoRotate = false; changeZoom(-300); });

            // Mouse / Touch Drag to Rotate
            const dragStart = (e) => {
                if (e.target.tagName === 'BUTTON') return;
                isDragging = true;
                autoRotate = false;
                world.style.transition = 'none';
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                document.getElementById('instructions').style.opacity = '0';
            };

            const dragMove = (e) => {
                if (!isDragging) return;
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                
                rotY += (x - startX) * 0.3;
                rotX -= (y - startY) * 0.3;
                rotX = Math.max(-85, Math.min(5, rotX)); // Prevent flipping upside down
                
                startX = x;
                startY = y;
                updateTransform();
            };

            const dragEnd = () => {
                isDragging = false;
                world.style.transition = 'transform 0.1s linear';
            };

            document.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchstart', dragStart, {passive: false});
            document.addEventListener('touchmove', dragMove, {passive: false});
            document.addEventListener('touchend', dragEnd);
        });
    </script>
</body>
</html>
